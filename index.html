<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: 'Courier New', Courier, monospace;
    background-color: #0d0d0d;
    color: #33ff33;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
    height: 100vh;
    margin: 0;
    box-sizing: border-box;
    text-shadow: 0 0 5px #33ff33;
  }
  button {
    background-color: #000;
    color: #33ff33;
    border: 2px solid #33ff33;
    padding: 12px 24px;
    cursor: pointer;
    font-size: 16px;
    font-family: inherit;
    box-shadow: 0 0 10px #33ff33;
    transition: all 0.3s ease;
    text-transform: uppercase;
  }
  button:hover {
    background-color: #33ff33;
    color: #000;
    box-shadow: 0 0 20px #33ff33;
  }
  .display-box {
    margin-top: 1.5rem;
    padding: 1.5rem;
    border: 2px solid #00ffff;
    width: 350px;
    min-height: 80px;
    background-color: rgba(0, 255, 255, 0.05);
    box-shadow: inset 0 0 10px #00ffff, 0 0 10px #00ffff;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  #ai-display {
    border-color: #ff00ff;
    box-shadow: inset 0 0 10px #ff00ff, 0 0 10px #ff00ff;
  }
</style>
</head>
<body>

<button id="start-btn">Initialize Connection</button>
<div id="input-display" class="display-box">Awaiting input...</div>
<div id="ai-display" class="display-box">Awaiting response...</div>

<script>
  const startBtn = document.getElementById('start-btn');
  const inputDisplay = document.getElementById('input-display');
  const aiDisplay = document.getElementById('ai-display');

  const recognition = new webkitSpeechRecognition() || new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;

  const API_KEY = 'AQ.Ab8RN6IC1DAd6ZsXrvd_IAdcQdrRY08o53j27f-zdg787D0x8g'; 

  startBtn.addEventListener('click', () => {
    recognition.start();
    inputDisplay.textContent = "Listening...";
    aiDisplay.textContent = "Processing...";
  });

  recognition.onresult = async (event) => {
    const transcript = event.results[0][0].transcript;
    inputDisplay.textContent = `> ${transcript}`;
    
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${API_KEY}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: transcript }]
          }]
        })
      });

      const data = await response.json();
      const reply = data.candidates[0].content.parts[0].text;
      aiDisplay.textContent = `> ${reply}`;
    } catch (error) {
      aiDisplay.textContent = `> ERROR: ${error.message}`;
    }
  };

  recognition.onerror = (event) => {
    inputDisplay.textContent = `> ERROR: ${event.error}`;
  };
</script>

</body>
</html>
